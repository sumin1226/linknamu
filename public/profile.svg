<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="플라밍고 아바타">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#ff8fc4" />
      <stop offset="55%" stop-color="#f6368f" />
      <stop offset="100%" stop-color="#b2126a" />
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe4ef" />
      <stop offset="100%" stop-color="#ffb9d4" />
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd27a" />
      <stop offset="45%" stop-color="#ffb347" />
      <stop offset="55%" stop-color="#3a2230" />
      <stop offset="100%" stop-color="#241521" />
    </linearGradient>
  </defs>

  <rect width="160" height="160" fill="url(#bg)" />

  <!-- 배경 장식 -->
  <circle cx="26" cy="30" r="9" fill="#ffffff" opacity="0.14" />
  <circle cx="140" cy="118" r="14" fill="#ffffff" opacity="0.1" />

  <!-- 다리 -->
  <path d="M74 126 L70 150" stroke="#ff9ec6" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M88 126 L96 142 L90 152" stroke="#ff9ec6" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- 꼬리 깃털 -->
  <path d="M34 100 L12 90 L34 92 L16 80 L38 88 Z" fill="url(#body)" opacity="0.9" />

  <!-- 몸통 -->
  <ellipse cx="68" cy="106" rx="37" ry="26" fill="url(#body)" />

  <!-- 목 -->
  <path d="M80 96 C 64 74, 76 44, 99 40" stroke="url(#body)" stroke-width="15" stroke-linecap="round" fill="none" />

  <!-- 머리 -->
  <circle cx="102" cy="40" r="13" fill="#ffe4ef" />

  <!-- 부리 -->
  <path d="M112 34 L146 48 L112 50 Z" fill="url(#beak)" />

  <!-- 선글라스 -->
  <path d="M93 36 H117" stroke="#1d1320" stroke-width="3" stroke-linecap="round" />
  <circle cx="99" cy="38" r="5.5" fill="#1d1320" />
  <circle cx="113" cy="38" r="5.5" fill="#1d1320" />
  <circle cx="97.5" cy="36.5" r="1.6" fill="#ffffff" opacity="0.65" />
  <circle cx="111.5" cy="36.5" r="1.6" fill="#ffffff" opacity="0.65" />

  <!-- 날개 -->
  <ellipse cx="62" cy="104" rx="23" ry="14" fill="#ff9ec6" opacity="0.55" transform="rotate(-8 62 104)" />
</svg>
